<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Spelling Bee</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>🐝 Spelling Bee</h1><div class=small id=sc></div><button onclick=say(W[i])>🔊 Hear the word</button><br><input id=t autocomplete=off><br><button onclick=chk()>Check</button><div id=msg class=big></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}const W=["school", "teacher", "friend", "family", "because", "beautiful", "library", "yesterday", "vegetable", "homework"];let i=0,s=0;function chk(){if(t.value.trim().toLowerCase()===W[i]){s++;msg.textContent='✅'}else msg.textContent='❌ '+W[i];i++;t.value='';sc.textContent='Score '+s+'/'+i;if(i>=W.length){msg.textContent='Done! '+s+'/'+W.length;i=0;s=0;return}setTimeout(()=>{msg.textContent='';say(W[i])},1200)}sc.textContent='Score 0';</script></body></html>
