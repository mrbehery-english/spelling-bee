<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Spelling Bee</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>🐝 Spelling Bee</h1><div id=lv></div><div class=small id=sc></div><button onclick=say(P[i][0])>🔊 Hear the word</button><div class=small id=ar></div><input id=t autocomplete=off><br><button onclick=chk()>Check</button><div id=msg class=big></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}let LEV=0;function mkLevels(n,f){const e=document.getElementById('lv');e.innerHTML='';['Level 1','Level 2','Level 3'].forEach((t,k)=>{const b=document.createElement('button');b.textContent=t;b.className=k===LEV?'':'alt';b.onclick=()=>{LEV=k;mkLevels(n,f);f()};e.appendChild(b)})}function part(D){const n=Math.ceil(D.length/3);return D.slice(LEV*n,(LEV+1)*n)}const D=[["school", "مدرسة"], ["friend", "صديق"], ["family", "عائلة"], ["teacher", "مدرس"], ["house", "بيت"], ["water", "ماء"], ["apple", "تفاحة"], ["happy", "سعيد"], ["green", "أخضر"], ["mother", "أم"], ["brother", "أخ"], ["monday", "الاثنين"], ["because", "لأن"], ["beautiful", "جميل"], ["library", "مكتبة"], ["yesterday", "امبارح"], ["vegetable", "خضار"], ["homework", "واجب"], ["breakfast", "فطار"], ["people", "ناس"], ["necessary", "ضروري"], ["environment", "بيئة"], ["restaurant", "مطعم"], ["different", "مختلف"], ["February", "فبراير"], ["answer", "إجابة"], ["knowledge", "معرفة"], ["government", "حكومة"], ["receive", "يستلم"], ["friendship", "صداقة"], ["separate", "منفصل"], ["definitely", "بالتأكيد"], ["embarrass", "يحرج"], ["neighbour", "جار"], ["temperature", "درجة الحرارة"], ["pronunciation", "نطق"], ["accommodation", "إقامة"], ["recommend", "ينصح"], ["occasion", "مناسبة"], ["conscience", "ضمير"]];let P=[],i=0,s=0;function start(){P=part(D);i=0;s=0;t.value='';sc.textContent='Score 0';ar.textContent=P[0][1];msg.textContent=''}function chk(){if(t.value.trim().toLowerCase()===P[i][0].toLowerCase()){s++;msg.textContent='✅'}else msg.textContent='❌ '+P[i][0];i++;t.value='';sc.textContent='Score '+s+'/'+i;if(i>=P.length){msg.textContent='Done! '+s+'/'+P.length;setTimeout(start,2500);return}ar.textContent=P[i][1];setTimeout(()=>{msg.textContent='';say(P[i][0])},1200)}mkLevels(3,start);start();</script></body></html>
